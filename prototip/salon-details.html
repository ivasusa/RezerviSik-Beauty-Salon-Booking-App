<!DOCTYPE html>
<!-- Autor: Iva Šuša -->
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezerviŠik - Detalji Salona</title>
    <link rel="stylesheet" href="main-styles.css">
    <script src="main-scripts.js" defer></script>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <img src="logo.png" alt="RezerviŠik Logo" style="height: 40px; margin-right: 10px; vertical-align: middle;">
                RezerviŠik
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Početna</a></li>
                <li><a href="salons.html">Saloni</a></li>
                <li><a href="login.html">Prijava</a></li>
                <li><a href="register.html">Registracija</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div id="salon-detail-content">
            <div style="text-align: center; padding: 2rem;">
                <p>Učitavanje detalja salona...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const salonId = urlParams.get('salon');
            if (salonId) {
                showSalonDetails(salonId);
            } else {
                document.getElementById('salon-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 2rem; background-color: #edc7c1; border-radius: 10px;">
                        <h2>Salon nije pronađen</h2>
                        <p>Molimo vas da se vratite na listu salona i izaberete salon.</p>
                        <a href="salons.html" class="btn">Nazad na salone</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
