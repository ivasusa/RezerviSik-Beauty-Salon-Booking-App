<!DOCTYPE html>
<!-- Autor: Sandra Bubanja -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main-styles.css">
    <script src="main-scripts.js"></script>
</head>
<body>
<header class="header">
    <nav class="nav">
<div class="logo">
                <img src="logo.png" alt="RezerviŠik Logo" style="height: 40px; margin-right: 10px; vertical-align: middle;">
                RezerviŠik
            </div><div class="user-info"><button class="btn" onclick="window.location.href='salons.html'">
        Pretraži salone
    </button></div>        <div class="user-info">Jovana Marković (Klijent)</div>
        <div class="user-info"><button class="btn" onclick="confirmLogout()">Odjavi se</button></div>
    </nav>
</header>
    <main class="main">
         <div class="client-grid">
            <aside class="sidebar">
                <h3>Moj Panel</h3>
                <ul class="sidebar-menu">
                    <li><a href="klijentPregled.html">Pregled</a></li>
                    <li><a href="klijentMojeRez.html">Moje rezervacije</a></li>
                    <li><a href="klijentRec.html">Recenzije</a></li>
                    <li><a href="klijentMojProfil.html">Moj profil</a></li>
                </ul>
            </aside>
            <div class="content">
                <div id="profile">
                            <h2>Moj profil</h2>
                             <div class="profile-form">
                                <form>
                                    <div class="form-group">
                                        <label for="name">Ime i prezime:</label>
                                        <input type="text" id="name" value="Jovana Marković" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="email">Email:</label>
                                        <input type="email" id="email" value="jovana@email.com" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="phone">Telefon:</label>
                                        <input type="tel" id="phone" value="+381 60 987 6543" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="password">Nova lozinka:</label>
                                        <input type="password" id="password" placeholder="Unesite novu lozinku">
                                    </div>
                                    <div class="form-group">
                                        <label for="confirm-password">Potvrdi lozinku:</label>
                                        <input type="password" id="confirm-password" placeholder="Potvrdite novu lozinku">
                                    </div>
                                    <button type="submit" class="btn">Sačuvaj Promene</button>
                                </form>
                            </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
