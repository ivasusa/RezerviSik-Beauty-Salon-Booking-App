<!DOCTYPE html>
<!-- Autor: Iva Šuša -->
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezerviŠik - Prijava</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main-styles.css' %}">
</head>
<body>
<header class="header">
    <nav class="nav">
        <div class="logo">
            <img src="{% static 'logo.png' %}" alt="RezerviŠik Logo" style="height: 40px; margin-right: 10px; vertical-align: middle;">
            RezerviŠik
        </div>

        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Početna</a></li>
            <li><a href="{% url 'salonViews' %}">Saloni</a></li>
            <li><a href="{% url 'register_user' %}">Registracija</a></li>
        </ul>
    </nav>
</header>

<main class="main">
    <div class="login-form">

        <h2>Prijava</h2>

        {% if error %}
            <p style="color: #b30000; text-align:center; margin-bottom: 1rem;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST" action="{% url 'login_user' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Email:</label>
                <input name="email" type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Lozinka:</label>
                <input name="password" type="password" id="password" required>
            </div>

            <button type="submit" class="btn" id="loginButton" style="margin: 0 auto; display: block;">
                Prijavi se
            </button>
        </form>

        <p style="margin-top: 1rem; text-align: center;">
            <a href="{% url 'register_user' %}" style="color: #5a4d47;">Nemate nalog? Registrujte se</a>
        </p>
    </div>
</main>

</body>
</html>
